<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
    <title>Wattonaut Ride</title>
    <link rel="stylesheet" href="shell.css">
    <script src="dialog.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="origin" class="origin" hidden></p>
      <p id="status" role="status"></p>
      <form>
        <fieldset id="picker" hidden>
          <legend>Nearby devices</legend>
          <p id="signal-note" class="hint" hidden>Signal strength unavailable</p>
          <div id="devices"></div>
        </fieldset>
        <label for="pin" hidden>Bluetooth PIN</label>
        <input id="pin" type="text" maxlength="16" autocomplete="off" hidden>
        <div class="actions">
          <button id="cancel" type="button">Cancel</button>
          <button id="submit" type="submit" disabled></button>
        </div>
      </form>
    </main>
  </body>
</html>
