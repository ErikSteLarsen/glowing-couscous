<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
    <title>Tempo Ride Bluetooth</title>
    <link rel="stylesheet" href="shell.css">
    <script src="dialog.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="status" role="status"></p>
      <form>
        <select id="devices" aria-label="Nearby Bluetooth devices" size="5" hidden></select>
        <label for="pin" hidden>Bluetooth PIN</label>
        <input id="pin" type="text" maxlength="16" autocomplete="off" hidden>
        <div class="actions">
          <button id="cancel" type="button">Cancel</button>
          <button id="submit" type="submit"></button>
        </div>
      </form>
    </main>
  </body>
</html>
