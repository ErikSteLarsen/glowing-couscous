<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
    <title>Wattonaut Ride</title>
    <link rel="stylesheet" href="shell.css">
    <script src="start.js" defer></script>
  </head>
  <body>
    <main>
      <img class="app-icon" src="../build/icon.png" alt="" width="48" height="48">
      <h1>Wattonaut Ride</h1>
      <p>Open your Wattonaut site to choose an indoor ride.</p>
      <form>
        <label for="site">Wattonaut site URL</label>
        <input id="site" type="url" placeholder="https://wattonaut.example" required autofocus>
        <p id="error" role="alert"></p>
        <button class="quick-option" type="button" hidden>Use http://localhost:3000</button>
        <div class="actions">
          <button type="submit">Open Wattonaut</button>
        </div>
      </form>
    </main>
  </body>
</html>
