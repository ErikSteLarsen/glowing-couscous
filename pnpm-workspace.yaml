allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # GHSA-ggr8-5vv4-36mx: @prisma/config 6.x pins deepmerge-ts 7.1.5. It only calls
  # deepmerge(); v8 breaking changes affect deepmergeInto and custom-merge typings.
  # Prisma 7's @prisma/config ships 8.0.2. Remove when Prisma is upgraded to 7.
  '@prisma/config>deepmerge-ts': 8.0.2
