name: Tempo Ride release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            installers: desktop/dist/Tempo-Ride-Windows-Setup.exe
          - os: macos-latest
            target: mac
            installers: |
              desktop/dist/Tempo-Ride-macOS-arm64.dmg
              desktop/dist/Tempo-Ride-macOS-x64.dmg
          - os: ubuntu-latest
            target: linux
            installers: |
              desktop/dist/Tempo-Ride-Linux.AppImage
              desktop/dist/Tempo-Ride-Linux.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-ride-${{ matrix.target }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tempo-ride-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(
            installers/Tempo-Ride-Windows-Setup.exe
            installers/Tempo-Ride-macOS-arm64.dmg
            installers/Tempo-Ride-macOS-x64.dmg
            installers/Tempo-Ride-Linux.AppImage
            installers/Tempo-Ride-Linux.deb
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --latest --title "Tempo Ride ${TAG#desktop-v}" \
              --notes "The Windows installer is unsigned. The macOS apps use ad hoc signatures and are not notarized. See desktop/README.md for installation."
          fi
